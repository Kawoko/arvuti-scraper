name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # `npm ci` validates every dependency edge in the lockfile, and this
      # lockfile cannot be made complete from Windows: npm there never descends
      # into the platform-gated `@tailwindcss/oxide-wasm32-wasi` subtree, so
      # `ci` rejects it on Linux. `npm install` reconciles the same lock without
      # that strict validation. Every dependency is still pinned by the lock.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values: the build only needs the variables to exist, and no
          # real credentials are ever used during CI.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
